<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Newsletter Section</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Newsletter Section ── */
    .newsletter-section {
      position: relative;
      width: 100%;
      min-height: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }

    /* Background image via unsplash (traveler/landscape) */
    .newsletter-bg {
      position: absolute;
      inset: 0;
      background-image: url('https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?w=1400&auto=format&fit=crop');
      background-size: cover;
      background-position: center 30%;
      filter: brightness(.92);
    }

    /* White fade overlay top & bottom */
    .newsletter-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom,
          rgba(255,255,255,.82) 0%,
          rgba(255,255,255,.55) 35%,
          rgba(255,255,255,.55) 65%,
          rgba(255,255,255,.82) 100%);
    }

    /* Blue dashed border frame */
    .newsletter-frame {
      position: absolute;
      inset: 10px;
      border: 2px dashed rgba(59, 130, 246, .55);
      border-radius: 6px;
      pointer-events: none;
    }
    /* Corner dots */
    .newsletter-frame::before,
    .newsletter-frame::after {
      content: '';
      position: absolute;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #3b82f6;
    }
    .newsletter-frame::before { top: -5px; left: 50%; transform: translateX(-50%); }
    .newsletter-frame::after  { bottom: -5px; right: -5px; }
    .corner-dot {
      position: absolute;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #3b82f6;
    }
    .corner-dot.tl { top: 5px;  left: 5px;  }
    .corner-dot.tr { top: 5px;  right: 5px; }
    .corner-dot.bl { bottom: 5px; left: 5px; }
    .corner-dot.br { bottom: 5px; right: 5px; }

    /* Content */
    .newsletter-content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 60px 24px;
      max-width: 700px;
      width: 100%;
    }

    .newsletter-title {
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 800;
      color: #111827;
      line-height: 1.25;
      margin-bottom: 18px;
      animation: fadeDown .6s ease both;
    }

    /* Checkmark badges */
    .newsletter-badges {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 28px;
      animation: fadeDown .6s .1s ease both;
    }
    .badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: .82rem;
      font-weight: 500;
      color: #374151;
    }
    .badge-icon {
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #2563eb;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .badge-icon svg {
      width: 10px; height: 10px;
      stroke: #fff;
      stroke-width: 2.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Form */
    .newsletter-form {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      max-width: 480px;
      margin: 0 auto;
      animation: fadeDown .6s .2s ease both;
    }
    .newsletter-input {
      flex: 1;
      height: 48px;
      padding: 0 18px;
      font-size: .9rem;
      font-family: 'Inter', sans-serif;
      color: #374151;
      background: #ffffff;
      border: 1.5px solid #e5e7eb;
      border-right: none;
      border-radius: 6px 0 0 6px;
      outline: none;
      transition: border-color .25s;
    }
    .newsletter-input::placeholder { color: #9ca3af; }
    .newsletter-input:focus { border-color: #2563eb; }

    .newsletter-btn {
      height: 48px;
      padding: 0 24px;
      font-size: .9rem;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      color: #111827;
      background: #fbbf24;
      border: none;
      border-radius: 0 6px 6px 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background .25s, transform .2s;
      white-space: nowrap;
    }
    .newsletter-btn:hover  { background: #f59e0b; transform: scale(1.03); }
    .newsletter-btn:active { transform: scale(.98); }
    .newsletter-btn svg {
      width: 14px; height: 14px;
      stroke: #111827;
      stroke-width: 2.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Success message */
    .newsletter-success {
      display: none;
      margin-top: 14px;
      font-size: .85rem;
      font-weight: 600;
      color: #16a34a;
      animation: fadeDown .4s ease both;
    }

    /* Animations */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Responsive */
    @media (max-width: 500px) {
      .newsletter-form { flex-direction: column; }
      .newsletter-input {
        width: 100%;
        border-right: 1.5px solid #e5e7eb;
        border-bottom: none;
        border-radius: 6px 6px 0 0;
      }
      .newsletter-input:focus { border-color: #2563eb; }
      .newsletter-btn {
        width: 100%;
        justify-content: center;
        border-radius: 0 0 6px 6px;
      }
    }
  </style>
</head>
<body>

<section class="newsletter-section">

  <!-- Background -->
  <div class="newsletter-bg"></div>

  <!-- Dashed border frame -->
  <div class="newsletter-frame"></div>
  <div class="corner-dot tl"></div>
  <div class="corner-dot tr"></div>
  <div class="corner-dot bl"></div>
  <div class="corner-dot br"></div>

  <!-- Content -->
  <div class="newsletter-content">

    <h2 class="newsletter-title">
      Subscribe to Our Newsletter &<br>Join Travlia Go.
    </h2>

    <div class="newsletter-badges">
      <div class="badge">
        <span class="badge-icon">
          <svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg>
        </span>
        The Best Travel Deals
      </div>
      <div class="badge">
        <span class="badge-icon">
          <svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg>
        </span>
        Exclusive Promotions
      </div>
      <div class="badge">
        <span class="badge-icon">
          <svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg>
        </span>
        Expert Travel Tips
      </div>
    </div>

    <div class="newsletter-form">
      <input
        class="newsletter-input"
        id="emailInput"
        type="email"
        placeholder="Enter Your Email"
        autocomplete="email"
      />
      <button class="newsletter-btn" id="subscribeBtn">
        Subscribe
        <svg viewBox="0 0 16 16">
          <line x1="2" y1="8" x2="13" y2="8"/>
          <polyline points="9,4 13,8 9,12"/>
        </svg>
      </button>
    </div>

    <p class="newsletter-success" id="successMsg">
      ✓ You're subscribed! Welcome to Travlia Go.
    </p>

  </div>
</section>

<script>
  const btn      = document.getElementById('subscribeBtn');
  const input    = document.getElementById('emailInput');
  const success  = document.getElementById('successMsg');

  btn.addEventListener('click', () => {
    const email = input.value.trim();

    // Basic email validation
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

    if (!valid) {
      input.style.borderColor = '#ef4444';
      input.focus();
      return;
    }

    input.style.borderColor = '#16a34a';
    btn.textContent = '✓ Subscribed!';
    btn.style.background = '#4ade80';
    btn.disabled = true;
    success.style.display = 'block';

    // Reset after 4 seconds
    setTimeout(() => {
      input.value = '';
      input.style.borderColor = '';
      btn.innerHTML = `Subscribe <svg viewBox="0 0 16 16" style="width:14px;height:14px;stroke:#111827;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round"><line x1="2" y1="8" x2="13" y2="8"/><polyline points="9,4 13,8 9,12"/></svg>`;
      btn.style.background = '';
      btn.disabled = false;
      success.style.display = 'none';
    }, 4000);
  });

  // Reset border on type
  input.addEventListener('input', () => {
    input.style.borderColor = '';
  });

  // Allow Enter key
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') btn.click();
  });
</script>

</body>
</html>
